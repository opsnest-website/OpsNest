name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types:
      - closed
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository including submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Always fetch the latest code from each submodule's main branch.
      - name: Update submodules to latest main
        run: |
          set -euo pipefail

          for module in modules/markbase modules/blogs; do
            echo "Updating ${module} from origin/main"

            if [ ! -d "${module}/.git" ] && \
               [ ! -f "${module}/.git" ]; then
              echo "::error::Submodule not initialized: ${module}"
              exit 1
            fi

            git -C "${module}" fetch origin main
            git -C "${module}" checkout -B main origin/main

            echo "Checked out commit:"
            git -C "${module}" log -1 --format='%h %s'
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Build Markbase learning module
      - name: Install Markbase dependencies
        working-directory: modules/markbase
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::Markbase package-lock.json is missing."
            npm install
          fi

      - name: Validate Markbase
        working-directory: modules/markbase
        run: npm run check --if-present

      - name: Build Markbase
        working-directory: modules/markbase
        run: npm run build

      # Build Blogs module
      - name: Install Blogs dependencies
        working-directory: modules/blogs
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::Blogs package-lock.json is missing."
            npm install
          fi

      - name: Validate Blogs
        working-directory: modules/blogs
        run: npm run check --if-present

      - name: Build Blogs
        working-directory: modules/blogs
        run: npm run build

      # Combine the main website and module builds
      - name: Prepare OpsNest site output
        run: |
          set -euo pipefail

          test -d modules/markbase/dist || {
            echo "::error::Markbase build output was not created."
            exit 1
          }

          test -d modules/blogs/dist || {
            echo "::error::Blogs build output was not created."
            exit 1
          }

          rm -rf dist
          mkdir -p dist

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.venv/' \
            --exclude='.venv-logo/' \
            --exclude='README.md' \
            --exclude='version_1.0.md' \
            --exclude='*.md' \
            --exclude='*.log' \
            --exclude='*.tmp' \
            --exclude='modules/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            ./ dist/

          mkdir -p dist/learn dist/blog

          rsync -a modules/markbase/dist/ dist/learn/
          rsync -a modules/blogs/dist/ dist/blog/

          touch dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4