name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types:
      - closed
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (including Markbase submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modules/markbase/package-lock.json

      - name: Build Markbase learning module
        working-directory: modules/markbase
        run: |
          npm ci
          npm run check
          npm run build

      - name: Prepare OpsNest site output
        run: |
          rm -rf dist
          mkdir -p dist
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.venv/' \
            --exclude '.venv-logo/' \
            --exclude 'README.md' \
            --exclude 'version_1.0.md' \
            --exclude '*.md' \
            --exclude '*.log' \
            --exclude '*.tmp' \
            --exclude 'modules/' \
            ./ dist/

          mkdir -p dist/learn
          rsync -a modules/markbase/dist/ dist/learn/
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
