name: Deploy to GitHub Pages

# A merged PR is a push to main, so `push` alone covers merges (a separate
# pull_request:closed trigger would deploy every merge twice).
on:
  push:
    branches:
      - main
      - master

  # Allow manual deployment from GitHub Actions UI
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository including submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Build exactly the Markbase/Blogs commits pinned in this repository, so every
      # deploy is reproducible and reviewable. Dependabot (.github/dependabot.yml)
      # opens a PR when a module's main branch moves; merging it deploys the update.
      - name: Show pinned module commits
        run: git submodule status

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Build Markbase learning module
      - name: Install Markbase dependencies
        working-directory: modules/markbase
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::Markbase package-lock.json is missing."
            npm install
          fi

      - name: Validate Markbase
        working-directory: modules/markbase
        run: npm run check --if-present

      - name: Build Markbase
        working-directory: modules/markbase
        run: npm run build

      # Build Blogs module
      - name: Install Blogs dependencies
        working-directory: modules/blogs
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::Blogs package-lock.json is missing."
            npm install
          fi

      - name: Validate Blogs
        working-directory: modules/blogs
        run: npm run check --if-present

      - name: Build Blogs
        working-directory: modules/blogs
        run: npm run build

      # Combine the main website and module builds
      - name: Prepare OpsNest site output
        run: |
          set -euo pipefail

          test -d modules/markbase/dist || {
            echo "::error::Markbase build output was not created."
            exit 1
          }

          test -d modules/blogs/dist || {
            echo "::error::Blogs build output was not created."
            exit 1
          }

          # Renders index.html + components/ + data/ and copies only the
          # published files (see STATIC_FILES in scripts/build.mjs).
          npm test
          npm run build

          mkdir -p dist/learn dist/blog

          rsync -a modules/markbase/dist/ dist/learn/
          rsync -a modules/blogs/dist/ dist/blog/

          touch dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }} 

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  health-check:
    name: Verify deployed endpoints
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check deployed website endpoints
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail

          SITE_URL="${SITE_URL%/}"

          if [ -z "${SITE_URL}" ]; then
            echo "::error::Deployment URL is empty."
            exit 1
          fi

          echo "Checking deployed site: ${SITE_URL}"

          check_endpoint() {
            local path="$1"
            local expected_content="${2:-}"
            local url="${SITE_URL}${path}"
            local body
            local status
            local attempt
            local max_attempts=10

            echo ""
            echo "Checking: ${url}"

            for attempt in $(seq 1 "${max_attempts}"); do
              body="$(mktemp)"

              status="$(curl \
                --silent \
                --show-error \
                --location \
                --connect-timeout 10 \
                --max-time 30 \
                --output "${body}" \
                --write-out '%{http_code}' \
                "${url}" 2>/dev/null || true)"

              if [ "${status}" = "200" ]; then
                if [ -n "${expected_content}" ] &&
                   ! grep -Fq "${expected_content}" "${body}"; then
                  echo "Attempt ${attempt}/${max_attempts}: HTTP 200, but expected content was missing."
                  rm -f "${body}"
                else
                  echo "PASS: ${url} returned HTTP ${status}"
                  rm -f "${body}"
                  return 0
                fi
              else
                echo "Attempt ${attempt}/${max_attempts}: HTTP ${status:-request failed}"
                rm -f "${body}"
              fi

              if [ "${attempt}" -lt "${max_attempts}" ]; then
                sleep 10
              fi
            done

            echo "::error::Health check failed for ${url}"
            return 1
          }

          # Main website
          check_endpoint "/" "<html"

          # Learning platform
          check_endpoint "/learn/" "<html"

          # Blog platform
          check_endpoint "/blog/" "<html"

          check_endpoint "/sitemap.xml" "<urlset"

          # Optional: check the sample blog image if it is deployed.
          # Uncomment this only when the image exists at this exact path.
          # check_endpoint "/blog/assets/devops_seamless.svg"

          echo ""
          echo "All configured endpoint health checks passed."        