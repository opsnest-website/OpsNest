name: Lint

# Runs on every PR (so problems block the merge) and on pushes to main.
on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site
        run: npm run build

      - name: Install linters
        run: npm install --global htmlhint@1 stylelint@16 stylelint-config-standard@36

      # Lints the rendered page plus the source partials.
      # Rules live in .htmlhintrc and .stylelintrc.json at the repository root.
      - name: Lint HTML
        run: htmlhint dist/index.html "components/**/*.html" "pages/*.html"

      - name: Lint CSS
        run: stylelint "css/**/*.css" "style.css"

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          find js scripts -name '*.js' -o -name '*.mjs' | xargs -r -n1 node --check
