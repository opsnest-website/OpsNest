name: Test

on:
  pull_request:
    types:
      - closed
    branches:
      - main
      - master

jobs:
  smoke-test:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/opsnest-server.log 2>&1 &
          echo $! > /tmp/opsnest-server.pid

      - name: Wait for server
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi

            sleep 1
          done

          echo "Server did not start"
          cat /tmp/opsnest-server.log
          exit 1

      - name: Smoke test the website
        run: |
          curl -fsS http://127.0.0.1:4173/ | grep -q 'OpsNest | Engineering Automation'

          for path in \
            assets/logo.svg \
            assets/favicon.png \
            css/base.css \
            css/components.css \
            css/responsive.css \
            js/app.js \
            CNAME
          do
            test -f "$path"
          done

      - name: Stop local server
        if: always()
        run: |
          if [ -f /tmp/opsnest-server.pid ]; then
            kill "$(cat /tmp/opsnest-server.pid)" || true
          fi