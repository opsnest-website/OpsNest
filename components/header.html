<header class="header">
    <div class="container">
        <a href="#" class="logo">
            <picture>
                <source srcset="assets/mark-light-bg.png" media="(prefers-color-scheme: light)" data-theme-source="light">
                <img src="assets/mark-dark-bg.png" width="54" height="54" alt="">
            </picture>
            <div class="logo-text">
                <span>{{ site.name }}</span>
                <small>{{ site.tagline }}</small>
            </div>
        </a>

        <div class="header-actions">
            <nav>
                <!-- @each link in navigation -->
                <!-- @include components/partials/nav-link.html -->
                <!-- @end -->
            </nav>

            <!-- Shown only when JavaScript runs (html.js); without it the site follows the system theme. -->
            <div class="theme-switch" role="group" aria-label="Colour theme">
                <button type="button" data-theme-choice="system" aria-pressed="true" aria-label="Match system theme" title="Match system">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
                </button>
                <button type="button" data-theme-choice="light" aria-pressed="false" aria-label="Light theme" title="Light">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                </button>
                <button type="button" data-theme-choice="dark" aria-pressed="false" aria-label="Dark theme" title="Dark">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg>
                </button>
            </div>
        </div>
    </div>
</header>
