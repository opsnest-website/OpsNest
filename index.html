<!DOCTYPE html>
<html lang="en">

<!--
    Page layout. Each section lives in components/, list content in data/.
    This file is a template: run `npm run dev` to preview or `npm run build` to produce dist/.
-->

<head>

    <!-- Basic Meta -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>{{ site.title }}</title>

    <meta name="description" content="{{ site.description }}">
    <meta name="keywords" content="{{ site.keywords }}">
    <meta name="author" content="{{ site.name }}">
    <meta name="theme-color" content="#0B1120" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)">

    <!-- Theme: apply the saved choice before the page paints, so it never flashes the wrong theme -->

    <script>
        try {
            var theme = localStorage.getItem("opsnest-theme");
            if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        } catch (error) {}
        document.documentElement.classList.add("js");
    </script>

    <!-- Open Graph -->

    <meta property="og:title" content="{{ site.name }}">
    <meta property="og:description" content="{{ site.headline }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ site.url }}/">
    <meta property="og:image" content="{{ site.url }}/assets/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="{{ site.name }} logo">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Favicon -->

    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS: css/style.css imports every stylesheet in cascade order; the build bundles it into one file -->

    <link rel="stylesheet" href="css/style.css">

</head>
